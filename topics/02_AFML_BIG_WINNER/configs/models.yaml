models:
  baseline:
    type: "random_forest"
    params:
      n_estimators: 300
      max_depth: 6
      min_samples_leaf: 50
      random_state: 42
      n_jobs: -1
  challenger:
    type: "lightgbm"
    enabled: false
    reason: "Enable only after event and label quality gates are acceptable."
  calibration:
    enabled: true
    method: "isotonic"
    fit_policy: "train_fold_only"
