[project]
name = "afml-big-winner"
version = "0.1.0"
description = "AFML-style A-share big winner research scaffold"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "matplotlib>=3.8.0,<4.0.0",
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.2.0,<3.0.0",
    "pyyaml>=6.0.0",
    "scikit-learn>=1.4.0,<2.0.0",
    "tqdm>=4.66.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.6.0,<1.0.0",
]

[project.scripts]
afml-bw-template-run = "afml_big_winner.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/afml_big_winner"]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "experiments"]

[tool.ruff]
line-length = 88
target-version = "py310"
