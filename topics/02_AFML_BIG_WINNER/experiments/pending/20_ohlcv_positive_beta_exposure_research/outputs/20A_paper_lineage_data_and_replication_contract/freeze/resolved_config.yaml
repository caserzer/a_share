formula_rows:
- arm_id: C1_TMOM_12_1
  family_id: TotalMomentum
  formula_id: TMOM_12_1
  formula_text: cumulative total return over the 11 months preceding the latest completed
    month; latest month excluded
  input_fields: monthly_total_return
  lag_rule: latest completed month excluded
  paper_section_or_equation: p11-p12 portfolio definition
  source_id: residual_momentum_full_paper
  warmup_rule: 12 complete calendar months
  weighting_rule: equal-weight project top decile
- arm_id: C2_TRENDPV_RAW_ADAPTATION
  family_id: TrendPV
  formula_id: TRENDPV_SIGNALS
  formula_text: MP_L=mean(close,L)/close_t and MV_L=mean(volume,L)/volume_t for L=3,5,10,20,50,100,200,300,400
  input_fields: qfq_close|normalized_volume_shares
  lag_rule: decision month-end only
  paper_section_or_equation: equations 1-4, pp5-6
  source_id: trend_china_full_working_paper
  warmup_rule: 400 sessions
  weighting_rule: equal-weight project top decile
- arm_id: C2_TRENDPV_RAW_ADAPTATION
  family_id: TrendPV
  formula_id: TRENDPV_MONTHLY_CS_REG
  formula_text: monthly predictive cross-section regression with EMA forecast coefficient
    lambda=0.02
  input_fields: monthly_total_return|TrendPV_signals
  lag_rule: only coefficients estimated through decision month
  paper_section_or_equation: equations 5-7, p6
  source_id: trend_china_full_working_paper
  warmup_rule: 400 sessions plus coefficient initialization
  weighting_rule: OLS cross-section; top-decile long-only project adaptation
- arm_id: P2_TREND_FULL_EXACT
  family_id: TrendPV
  formula_id: TRENDPV_FULL_FACTOR
  formula_text: exclude smallest 30 percent; independent Size 2 x EP 3 x Trend 3;
    VW high trend six minus low trend six
  input_fields: PIT_market_cap|PIT_EP|trend_score|monthly_total_return
  lag_rule: paper PIT timing
  paper_section_or_equation: section 2.2, pp6-7
  source_id: trend_china_full_working_paper
  warmup_rule: 400 sessions plus coefficient initialization
  weighting_rule: value weighted paper factor
- arm_id: P3_RESMOM_CH3_EXACT
  family_id: ResidualMomentum
  formula_id: RESMOM_EXACT_CH3
  formula_text: 36-month market/size/value regression; 12-1 residual return standardized
    by residual volatility
  input_fields: monthly_excess_return|CH3_factors
  lag_rule: paper 12-1
  paper_section_or_equation: equation 1 and pp11-12
  source_id: residual_momentum_full_paper
  warmup_rule: paper-defined 36-month regression
  weighting_rule: paper deciles
- arm_id: C3A_RESMOM_R2_MARKET_ONLY
  family_id: ResidualMomentum
  formula_id: RESMOM_R2_MARKET_ONLY_ADAPTATION
  formula_text: sequential one-step 36-month stock-on-CSI300 residual; score mean/std
    over exact 11 residual months with latest month skipped
  input_fields: stock_monthly_total_return|CSI300_monthly_total_return
  lag_rule: rolling regressions use s-36 through s-1 only
  paper_section_or_equation: project adaptation of equation 1 and pp11-12
  source_id: residual_momentum_full_paper
  warmup_rule: 47 complete prior months
  weighting_rule: equal-weight project top decile
- arm_id: C3_RESMOM_R3_BOARD_ADAPTATION
  family_id: ResidualMomentum
  formula_id: RESMOM_R3_BOARD_ADAPTATION
  formula_text: R2 market residual first; monthly cross-sectional ridge with alpha=1.0
    on lagged log market cap and static 2025 board multi-hot; 11-month mean/std score
  input_fields: R2_market_residual|lagged_market_cap|board_multi_hot
  lag_rule: market regression s-36:s-1; size as of s-1
  paper_section_or_equation: project two-stage adaptation of equation 1 and industry
    robustness
  source_id: residual_momentum_full_paper
  warmup_rule: 47 complete prior months
  weighting_rule: equal-weight project top decile
- arm_id: C4_LOWVOL
  family_id: LowVol
  formula_id: LOWVOL_36M
  formula_text: standard deviation of preceding 36 complete monthly total returns
  input_fields: monthly_total_return
  lag_rule: through latest completed month
  paper_section_or_equation: methodology low-volatility ranking
  source_id: china_low_vol_full_article
  warmup_rule: 36 complete months
  weighting_rule: equal-weight lowest project decile
- arm_id: D1_FIP_INCREMENT
  family_id: FIP
  formula_id: FIP_ID
  formula_text: ID=sign(PRET)*(percent negative-return days - percent positive-return
    days)
  input_fields: daily_return|PRET_12_1
  lag_rule: latest completed month excluded
  paper_section_or_equation: information discreteness definition
  source_id: fip_full_working_paper
  warmup_rule: 12 months plus daily sign coverage
  weighting_rule: diagnostic challenger only
- arm_id: E2_MA20_OVERLAY
  family_id: MAOverlay
  formula_id: MA20_OVERLAY
  formula_text: hold sleeve only when prior sleeve close exceeds prior MA20; otherwise
    cash
  input_fields: sleeve_daily_NAV
  lag_rule: prior close and prior MA20
  paper_section_or_equation: moving-average portfolio timing rule
  source_id: ma_portfolio_timing_full_paper
  warmup_rule: 20 sessions
  weighting_rule: portfolio overlay only
- arm_id: F1_CNN_ORACLE
  family_id: CNN
  formula_id: CNN_MAIN_DEFERRED
  formula_text: 20-session 60x64 OHLC+MA20 image with bottom-20-percent volume panel
    and next-20-session sign label
  input_fields: OHLCV|MA20
  lag_rule: strict time split
  paper_section_or_equation: image construction and prediction setup
  source_id: ohlcv_cnn_full_paper
  warmup_rule: 20 sessions plus calendar support gate
  weighting_rule: oracle diagnostic only
