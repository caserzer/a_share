account:
  inheritance: ../41_csi300_csi800_weekly_monthly_alpha/config.yaml
  primary_pool: historical_CSI300_eligible
  signal: close_t
  entry: open_t_plus_1
  exit: open_t_plus_11
  sleeves: 10
  fees_bp: {net_buy: 10, net_sell: 20}
  holding_horizon: 10
  training: weekly_rows_quarterly_expanding
  label_maturity: strictly_before_prediction_quarter
  primary_metric: paired_mean_net_bp_per_common_full_month
  segments_300:
    - ['2021-01-11', '2025-03-03']
    - ['2025-03-03', '2026-10-12']
  segments_800:
    - ['2021-01-11', '2023-06-15']
    - ['2023-06-19', '2025-03-03']
    - ['2025-03-03', '2026-10-12']
  bootstrap: {method: within_segment_paired_moving_blocks, months: 3, draws: 10000, seed: 4201, interval: two_sided_percentile_95}
  concentration_check: drop_best_three_months_per_segment
  forward_origin: first_actual_pre_entry_timestamp_after_version_freeze
  forward_checkpoints_mature_nonoverlapping_h10: [12, 24]

state_mixture:
  primary_id: D5
  score_inputs: [frozen_Ridge78, frozen_raw_tree69]
  score_normalization: average_cross_section_rank_divided_by_N_plus_1
  primary_state: Z1
  Z1: trailing_20_session_mean_of_daily_eligible_stock_return_IQR
  Z2: trailing_5_session_mean_of_median_stock_value_traded_over_prior_60_session_mean
  Z3: 60_session_CSI300_total_return
  Z4: drawdown_from_trailing_60_session_CSI300_total_return_index_high
  percentile_reference: prior_252_sessions_excluding_signal_date
  minimum_valid_names_for_cross_section: 100
  static_tree_weights: [0, 0.0875, 0.175, 0.2625, 0.35]
  slope_in_tie_order: [0, 1, -1]
  dynamic_tree_weight: 'clip(b + s * 0.175 * (2 * Z1 - 1), 0, 0.35)'
  missing_state: same_quarter_static_b
  missing_inner_history: both_use_Ridge
  inner_window_completed_quarters: 8
  min_inner_quarters: 4
  constant_reference: same_quarter_b_chosen_on_same_mature_inner_oof
  decision: both_segment_means_positive_and_pooled_lower_95_above_zero_then_assess_concentration_and_coverage
  secondary_multiplicity: all_preregistered_like_contrasts_within_id_Holm_if_significance_reported

# spec is the canonical per-item protocol, including component arms and conditional variants.
# All items inherit registered_pending_execution. D4A–D4D are components of D4.
register:
  A1: {role: attribution, spec: 'ATTRIBUTION.md#a1', contrast: original_head_minus_runner_attributed_on_original_books}
  A2: {role: attribution, spec: 'ATTRIBUTION.md#a2', contrast: tree_removals_minus_ridge_boundary_with_same_rank_buys}
  A3: {role: attribution, spec: 'ATTRIBUTION.md#a3', contrast: tree_buy_minus_rank_buy_all_offsets_common_start_and_holding_age}
  A4: {role: attribution, spec: 'ATTRIBUTION.md#a4', contrast: feature_group_masking_and_account_session_reconciliation}
  A5: {role: attribution, spec: 'ATTRIBUTION.md#a5', contrast: gated_versus_original_orders_and_mechanically_matched_pairs}
  D1: {role: exploratory, spec: 'CANDIDATES.md#d1', contrast: tree_versus_ridge_boundary_removal_on_natural_buys}
  D2: {role: exploratory, spec: 'CANDIDATES.md#d2', contrast: path_conditioned_versus_rank_only_retention}
  D3: {role: exploratory, spec: 'CANDIDATES.md#d3', contrast: dual_tail_versus_left_tail_veto_equal_replacement_budget}
  D4: {role: exploratory, spec: 'CANDIDATES.md#d4', components: [D4A_EPS_revisions, D4B_quarterly_surprises, D4C_ETF_baskets, D4D_supply_events], contrast: source_specific_versus_same_coverage_same_budget_control}
  D5: {role: primary, spec: 'MARKET_STATE.md#d5', contrast: state_adaptive_versus_quarterly_static_score_mix}
  D6: {role: exploratory, spec: 'CANDIDATES.md#d6', contrast: domain_refit_versus_pooled_scores_same_domain_budgets}
  S1: {role: mechanism, spec: 'ABSOLUTE_SCALE.md#s1', contrast: tree_path_shifts_current_versus_fixed_members}
  S2: {role: mechanism, spec: 'ABSOLUTE_SCALE.md#s2', contrast: raw_versus_rank_mapped_to_fixed_reference_mask_matched}
  S3: {role: mechanism, spec: 'ABSOLUTE_SCALE.md#s3', contrast: actual_vs_fixed_cross_section_location_and_scale}
  S4: {role: mechanism, spec: 'ABSOLUTE_SCALE.md#s4', contrast: correctly_dated_versus_lagged_joint_scales}
  S5: {role: mechanism, spec: 'ABSOLUTE_SCALE.md#s5', contrast: scale_effect_within_same_sector_style_opportunities}
  G1: {role: mechanism, spec: 'MARKET_STATE.md#g1', contrast: high_minus_low_Z1_tree_minus_ridge_common_start}
  G2: {role: mechanism, spec: 'MARKET_STATE.md#g2', contrast: matched_input_and_loss_tree_versus_linear_state_spread}
  G3: {role: mechanism, spec: 'MARKET_STATE.md#g3', contrast: varying_coefficient_ridge_versus_same_main_effects}
  G4: {role: mechanism, spec: 'MARKET_STATE.md#g4', contrast: dynamic_minus_static_by_score_mix_versus_budget_mix}
  G5: {role: mechanism, spec: 'MARKET_STATE.md#g5', contrast: incremental_state_beyond_Z1}
  G6: {role: mechanism, spec: 'MARKET_STATE.md#g6', contrast: contemporaneous_versus_lagged_weight_gate}
  G7: {role: mechanism, spec: 'MARKET_STATE.md#g7', contrast: transferred_dynamic_versus_static_in_non300_sleeve}

