primary_candidate_source:
  source_id: EP07_topn_multichannel_recommended_union
  source_phase_id: "07"
  canonical_path_key: ep07_candidate_canonical
  label_path_key: ep07_candidate_labels
  decision_date_column: event_t0_date
  decision_pos_column: event_t0_pos
  entry_date_column: trade_open_date
  entry_price_column: trade_open_price
  split_column: event_split
  instrument_column: instrument
  event_id_column: event_id
  non_executable_column: non_executable_next_open
  liquidity_column: liquidity_money_20d
  market_cap_column: total_market_cap_cny

execution:
  decision_time_bucket: after_close_t
  entry_price_source: qfq_open_next_tradable_day
  liquidity_floor_cny: 20000000
  impact_cost_proxy_warn_bps: 50
  candidate_budget_cny: 1000000
  primary_cooldown_window_sessions: 10
  sensitivity_cooldown_window_sessions: [5, 20]

labels:
  primary_horizon_sessions: 120
  primary_big_winner_threshold: 0.50
  primary_label_requires_path_complete_120: true
  survival_fallback_trigger_path_complete_120_rate: 0.70

split:
  split_column: event_split
  train: train
  robustness: robustness
  validation: validation
  purge_window_sessions: 120
  embargo_window_sessions: 20

minimum_support:
  train_primary_denominator_n: 5000
  robustness_primary_denominator_n: 1000
  validation_primary_denominator_n: 300
  train_instrument_n: 100
  robustness_instrument_n: 50
  validation_instrument_n: 30
  primary_path_complete_120_rate: 0.70
  effective_sample_ratio: 0.30

baseline:
  primary_baseline_pass_rule: conjunctive_pass_across_all_three_baselines
  families:
    - calendar_time_random_same_budget
    - instrument_matched_random_same_budget
    - liquidity_size_volatility_matched_same_budget
  matching_keys:
    - decision_month
    - instrument_or_industry_bucket_if_supported
    - market_cap_bucket_asof_decision_date
    - rolling_20d_amount_bucket_asof_decision_date
    - rolling_60d_volatility_bucket_asof_decision_date
    - recent_20d_return_bucket_asof_decision_date
  quality_gates:
    unmatched_candidate_rate_max: 0.05
    baseline_reuse_rate_max: 0.20
    max_standardized_mean_difference_after_matching_max: 0.10
    decision_month_coverage_delta_max: 0.02
    instrument_coverage_delta_max: 0.05

grid_search:
  grid_parameter_n_per_family_max: 5
  grid_total_cells_all_families_max: 300
  validation_selected_cells: 0
  family_level_correction: Bonferroni-Sidak
  cell_level_accounting: all_tried_cells_counted
  n_family_cap: 10
  simple_families:
    B1_near_120d_high_plus_volume_expansion: {parameter_n: 4, grid_cell_n: 36, status: supported_primary_family}
    B2_relative_strength_breakout: {parameter_n: 4, grid_cell_n: 36, status: supported_primary_family}
    B3_industry_or_theme_breadth_expansion: {parameter_n: 0, grid_cell_n: 0, status: unsupported_primary_feature}
    B4_volatility_contraction_then_breakout: {parameter_n: 4, grid_cell_n: 36, status: supported_primary_family}
    B5_recent_high_close_plus_amount_expansion: {parameter_n: 4, grid_cell_n: 36, status: supported_primary_family}
    B6_low_drawdown_reclaim_or_ema_reclaim: {parameter_n: 4, grid_cell_n: 36, status: supported_primary_family}

cost_assumptions:
  cost_schedule_source: frozen_19a_default_contract
  commission_buy_bps: 2.5
  commission_sell_bps: 2.5
  minimum_commission_cny: 5.0
  stamp_tax_sell_bps_by_effective_date: "2023-08-28:5.0"
  slippage_bps: 5.0
  next_open_execution_delay_sessions: 1
  limit_up_buy_handling: blocked_unfilled
  limit_up_fill_premium_bps: 0.0
  limit_down_exit_failure_handling: delayed_to_next_executable_open
  blocked_fill_opportunity_loss_policy: count_as_unfilled_opportunity_loss
  cost_assumption_status: frozen
