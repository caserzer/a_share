  lower_barrier_pct: -0.10
  horizon_sessions: 20
  keep_budget_primary: 0.50
  keep_budget_grid: [0.30, 0.50, 0.70]

stage_2:
  target_id: continuation_U20_L10_H2_20
  upper_barrier_pct: 0.20
  lower_barrier_pct: -0.10
  horizon_sessions_h2: 20
  continue_budget_primary: 0.50
