experiment:
  name: "topn_reverse_lifecycle_profile_v0"
  status: "implementation_v0"
  workstream: "Reverse Lifecycle Diagnostics"
  objective: "Rerun 02 reverse lifecycle on the PIT Top-N 400/100 universe/proxy."
  data_cutoff: "2026-05-31"

upstream:
  base_02_experiment_dir: "experiments/pending/02_big_winner_reverse_lifecycle_profile_v0"
  topn_05_experiment_dir: "experiments/pending/05_pit_topn_400_100_universe_v0"

paths:
  data_prepare_experiment_dir: "experiments/pending/01_data_prepare_pit_largecap_akshare_qlib_v0"
  stock_daily_csv_dir: "data/interim/qlib_csv/day"
  benchmark_daily_csv: "data/processed/index/benchmark_indices_daily.csv"
  executable_universe_csv: "data/processed/universe/pit_topn_400_100_executable_daily.csv"
  membership_universe_csv: "data/processed/universe/pit_topn_400_100_membership_daily.csv"
  fixed_cap_executable_universe_csv: "data/processed/universe/pit_largecap_main_chinext_executable_daily.csv"
  data_cache_manifest_csv: "data/raw/akshare/cache_manifest.csv"
  data_prepare_run_manifest_json: "experiments/pending/01_data_prepare_pit_largecap_akshare_qlib_v0/outputs/manifests/run_manifest.json"
  data_prepare_source_coverage_audit_csv: "experiments/pending/01_data_prepare_pit_largecap_akshare_qlib_v0/outputs/tables/source_coverage_audit.csv"
  upstream_02_config_yaml: "experiments/pending/02_big_winner_reverse_lifecycle_profile_v0/config.yaml"
  upstream_02_run_manifest_json: "experiments/pending/02_big_winner_reverse_lifecycle_profile_v0/outputs/manifests/run_manifest.json"
  upstream_05_run_manifest_json: "experiments/pending/05_pit_topn_400_100_universe_v0/outputs/manifests/run_manifest.json"
  upstream_05_data_source_coverage_audit_csv: "experiments/pending/05_pit_topn_400_100_universe_v0/outputs/publishable/tables/data_source_coverage_audit.csv"

upstream_02_publishable_tables:
  big_winner_episode_reference_summary: "experiments/pending/02_big_winner_reverse_lifecycle_profile_v0/outputs/publishable/tables/big_winner_episode_reference_summary.csv"
  validation_opportunity_audit: "experiments/pending/02_big_winner_reverse_lifecycle_profile_v0/outputs/publishable/tables/validation_opportunity_audit.csv"
  unconditional_validation_readout: "experiments/pending/02_big_winner_reverse_lifecycle_profile_v0/outputs/publishable/tables/unconditional_validation_readout.csv"
  regime_conditioned_validation_readout: "experiments/pending/02_big_winner_reverse_lifecycle_profile_v0/outputs/publishable/tables/regime_conditioned_validation_readout.csv"
  shared_axis_sequence_dominance: "experiments/pending/02_big_winner_reverse_lifecycle_profile_v0/outputs/publishable/tables/shared_axis_sequence_dominance.csv"
  shared_axis_factor_dominance: "experiments/pending/02_big_winner_reverse_lifecycle_profile_v0/outputs/publishable/tables/shared_axis_factor_dominance.csv"
  shared_axis_market_regime_dominance: "experiments/pending/02_big_winner_reverse_lifecycle_profile_v0/outputs/publishable/tables/shared_axis_market_regime_dominance.csv"
  winner_vs_matched_control_stats: "experiments/pending/02_big_winner_reverse_lifecycle_profile_v0/outputs/publishable/tables/winner_vs_matched_control_stats.csv"
  frozen_anchor_profile_summary: "experiments/pending/02_big_winner_reverse_lifecycle_profile_v0/outputs/publishable/tables/frozen_anchor_profile_summary.csv"
  winner_only_retrospective_stage_profile: "experiments/pending/02_big_winner_reverse_lifecycle_profile_v0/outputs/publishable/tables/winner_only_retrospective_stage_profile.csv"
  near_winner_comparison_stats: "experiments/pending/02_big_winner_reverse_lifecycle_profile_v0/outputs/publishable/tables/near_winner_comparison_stats.csv"
  false_repair_comparison_stats: "experiments/pending/02_big_winner_reverse_lifecycle_profile_v0/outputs/publishable/tables/false_repair_comparison_stats.csv"
  sequence_family_test_count: "experiments/pending/02_big_winner_reverse_lifecycle_profile_v0/outputs/publishable/tables/sequence_family_test_count.csv"

outputs:
  publishable_tables_dir: "experiments/pending/06_rerun_02_reverse_lifecycle_on_topn_universe_v0/outputs/publishable/tables"
  publishable_reports_dir: "experiments/pending/06_rerun_02_reverse_lifecycle_on_topn_universe_v0/outputs/publishable/reports"
  local_cache_dir: "experiments/pending/06_rerun_02_reverse_lifecycle_on_topn_universe_v0/outputs/local_cache"
  large_raw_dir: "experiments/pending/06_rerun_02_reverse_lifecycle_on_topn_universe_v0/outputs/large_raw"
  manifests_dir: "experiments/pending/06_rerun_02_reverse_lifecycle_on_topn_universe_v0/outputs/manifests"

episode_extraction:
  local_low_window_sessions: 20
  prior_lookback_sessions: 250
  forward_horizon_sessions: 120
  big_winner_mfe_threshold: 0.50
  near_winner_lower_mfe_threshold: 0.30
  near_winner_upper_mfe_threshold: 0.50
  post_high_exhaustion_sessions: 30

splits:
  train_start: "2017-01-03"
  train_end: "2021-12-31"
  validation_start: "2022-01-01"
  validation_end: "2023-12-31"
  robustness_start: "2024-01-01"

alignment:
  low_panel_start_relative_day: -60
  low_panel_end_relative_day: 120
  anchor_panel_start_relative_day: -60
  anchor_panel_end_relative_day: 60
  factor_relative_days:
    - 0
    - 5
    - 20
    - 60
    - 120
  anchor_factor_relative_days:
    - -20
    - 0
    - 20
    - 60
  anchor_family: "first_ema60_reclaim"
  ema60_window_sessions: 60

matching:
  max_controls_per_winner: 5
  same_week_required: true
  match_fields:
    - "board_bucket"
    - "market_cap_bucket"
    - "liquidity_bucket"
    - "prior_return_20d_bucket"
    - "prior_return_60d_bucket"
    - "prior_drawdown_bucket"
    - "volatility_bucket"

dominance:
  min_total_winner_episodes: 150
  min_validation_winner_episodes: 30
  min_robustness_winner_episodes: 30
  min_control_match_coverage: 0.80
  min_average_controls_per_winner: 3.0
  min_anchor_occurrences_for_claim: 50
  min_sequence_occurrences_for_claim: 50
  min_feature_non_missing_coverage_for_claim: 0.70
  standardized_mean_difference_gate: 0.25
  lift_gate: 1.25
  absolute_rate_difference_gate: 0.05
  min_anchor_year_coverage_for_claim: 3
  min_anchor_split_coverage_for_headline_claim: "train + validation + robustness"
  min_sequence_split_coverage_for_headline_claim: "train + validation + robustness"

industry:
  status: "unavailable"
  caveat: "No PIT industry membership file is present in the v0 data layer."
