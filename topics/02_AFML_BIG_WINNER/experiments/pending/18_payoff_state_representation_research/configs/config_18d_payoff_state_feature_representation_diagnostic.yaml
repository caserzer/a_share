  max_depth_values: [3, 4]
  random_state: 1818
  min_samples_leaf_floor: 50
  min_samples_leaf_train_fraction: 0.02
  cv_fold_n: 5
  cv_fold_seed: 1818
  cv_aggregation: unweighted_mean_across_pass_folds

