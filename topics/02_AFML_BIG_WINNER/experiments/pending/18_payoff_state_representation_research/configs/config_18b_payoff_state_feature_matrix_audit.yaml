split_column: cluster_split_bucket

feature_families:
  F1:
    name: continuation strength / repair persistence
    features:
      - ret_5d
      - ret_10d
      - ret_20d
      - ma_5_20_spread
      - ma_20_60_spread
      - distance_to_20d_high
      - distance_to_60d_high
  F2:
    name: participation / sponsorship
    features:
      - turnover_rate_20d_mean
      - turnover_rate_60d_mean
      - turnover_rate_20d_zscore
      - volume_20d_zscore
      - money_20d_zscore
  F3:
    name: cross-sectional leadership
    features:
      - board_rank_pct
      - board_rank_by_market_cap
  F4:
    name: path-risk decoupling
    features:
      - volatility_20d
      - volatility_60d
      - max_drawdown_20d
      - max_drawdown_60d
      - intraday_range_20d_mean
  F5:
    name: regime / board / market context
    features:
      - board_bucket_chinext
      - board_bucket_main_board
      - log_total_market_cap_cny
      - tradability_status_ok

binary_features:
  - board_bucket_chinext
  - board_bucket_main_board
  - tradability_status_ok

