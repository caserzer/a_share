outputs:
  tables_dir: "experiments/pending/09_riskon_fastfail_label_feature_uplift/outputs/publishable/tables"
  reports_dir: "experiments/pending/09_riskon_fastfail_label_feature_uplift/outputs/publishable/reports"
  manifests_dir: "experiments/pending/09_riskon_fastfail_label_feature_uplift/outputs/manifests"
  local_cache_dir: "experiments/pending/09_riskon_fastfail_label_feature_uplift/outputs/local_cache"

selection:
  primary_denominator_id: "risk_on_r_core_horizon_complete"
  oos_positive_rate_spread_force_diagnostic_threshold: 0.15
  train_positive_rate_min: 0.05
  train_positive_rate_max: 0.45
  train_not_evaluable_share_max: 0.005
  train_episode_winner_recall_retention_min: 0.85
  duplicate_jaccard_threshold: 0.90
  duplicate_kappa_threshold: 0.85
  selected_label_max_count: 2

stationary_hygiene:
  rolling_window_sessions: 60
  rolling_min_periods: 20
  fracdiff_d: 0.4
  fracdiff_max_lags: 20
  fracdiff_weight_threshold: 0.0001

diagnostic_model:
  estimator: "balanced_logistic"
  sklearn_class: "sklearn.linear_model.LogisticRegression"
  penalty: "l2"
  class_weight: "balanced"
  solver: "liblinear"
  random_state: 17
  max_iter: 1000

importance:
  permutation_random_state: 17
  stability_top_k: 3

cost_rejector:
  selected_target_label: "break_swing_low_20"
  selected_supported_target_id: "break_swing_low_20__or_false_repair_20d"
  selected_model_family: "regularized_logistic_or_elastic_net"
  selected_train_target_component: "hybrid_cost_bad_10_20"
  selected_ablation_id: "full"
  selected_calibration_id: "none"
  target_component_selection_policy: "hybrid_train_only_with_fast_fail_noncollapse_readout"
  threshold_selection_policy: "train_only_hybrid_cost_reduction_then_recall_with_fast_fail_noncollapse"
  baseline_replay_gate_refreeze_policy: "freeze_after_train_baseline_before_oos_readout"
  threshold_grid: [0.85, 0.825, 0.80, 0.775, 0.75, 0.725, 0.70]
  oos_positive_rate_spread_force_diagnostic_threshold: 0.15
  bridge_retention_min_train: "report_and_noncollapse"
  robustness_no_reversal_rule: "robustness_cost_reduction_gt_0_and_recall_min"
  family_concentration_cap: 0.30
  board_concentration_cap: 0.85
  fast_fail_only_bad_side_capture_min_policy: ">= selected_threshold_rejected_fraction_train"
  model:
    random_state: 17
    max_iter: 1000
    rf_n_estimators: 40
    rf_max_depth: 3
    rf_min_samples_leaf: 80
    rf_n_jobs: 1
  research_entry_gate:
    cost_reduction_min_train: 0.15
    any_recall_retention_min_train: 0.90
    e1_missed_retention_min_train: 0.85
    robustness_any_recall_retention_min: 0.80
    robustness_e1_missed_retention_min: 0.70
    fast_fail_only_auc_min_robustness: 0.60
    fast_fail_component_contribution_min_train: 0.10
  density_caps:
    formal_event_day_density: 7.50
    p95_density: 20.00
    rolling_10d_executable_event_day_density: 1.80
    rolling_20d_executable_event_day_density: 2.20
    family_concentration: 0.30
    board_concentration: 0.85

candidate_labels:
  fixed_mae10_neg_05:
    mechanism_family: "fixed_mae10"
    barrier_pct: -0.05
    selected_allowed: true
  fixed_mae10_neg_06:
    mechanism_family: "fixed_mae10"
    barrier_pct: -0.06
    selected_allowed: false
    candidate_label_status_override: "sensitivity_only"
  fixed_mae10_neg_08:
    mechanism_family: "fixed_mae10"
    barrier_pct: -0.08
    selected_allowed: true
  fixed_mae10_neg_10:
    mechanism_family: "fixed_mae10"
    barrier_pct: -0.10
    selected_allowed: true
  fixed_mae10_neg_12:
    mechanism_family: "fixed_mae10"
    barrier_pct: -0.12
    selected_allowed: true
  vol_sigma20_1_0:
    mechanism_family: "vol_scaled"
    sigma_window: 20
    sigma_multiplier: 1.0
    selected_allowed: true
  vol_sigma20_1_5:
    mechanism_family: "vol_scaled"
    sigma_window: 20
    sigma_multiplier: 1.5
    selected_allowed: true
  vol_sigma20_2_0:
    mechanism_family: "vol_scaled"
    sigma_window: 20
    sigma_multiplier: 2.0
    selected_allowed: true
  atr14_1_5:
    mechanism_family: "atr_scaled"
    atr_window: 14
    atr_multiplier: 1.5
    selected_allowed: true
  atr14_2_0:
    mechanism_family: "atr_scaled"
    atr_window: 14
    atr_multiplier: 2.0
    selected_allowed: true
  break_event_low:
    mechanism_family: "structural"
    structural_rule: "event_low"
    selected_allowed: true
  break_swing_low_20:
    mechanism_family: "structural"
    structural_rule: "swing_low"
    swing_lookback: 20
    selected_allowed: true
  break_ema20:
    mechanism_family: "structural"
    structural_rule: "ema"
    ema_span: 20
    selected_allowed: true
  break_ema60:
    mechanism_family: "structural"
    structural_rule: "ema"
    ema_span: 60
    selected_allowed: true
