    n_estimators: 1000
    learning_rate: 0.2
    num_leaves: 210
    max_depth: 8
    subsample: 0.8789
    colsample_bytree: 0.8879
    reg_alpha: 205.6999
    reg_lambda: 580.9768
    n_jobs: 20
    deterministic: true
  early_stopping_rounds: 50

model_attribution:
