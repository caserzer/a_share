selected_state_id: repair_range_participation_core_30
selected_label:
  label_id: vol20d_kup2p0_kdn1p0_H20
  vol_reference_id: volatility_20d
  k_up: 2.0
  k_dn: 1.0
  horizon_sessions: 20
  same_bar_priority: lower_first

cost_buffer:
  grid: [0.0, 0.0025, 0.005, 0.0075, 0.01]
  reference_return: 0.01
  moderate_return: 0.005

residualization:
  method: cell_mean_residualization
  min_treated_per_cell: 20
  min_control_per_cell: 50
  min_positive_per_split: 50
  quantile_bucket_n: 5
  decile_bucket_n: 10

model:
  family: low_capacity_logistic_l2
  l2_C: 0.50
  max_iter: 200
  permutation_n: 10
  random_seed: 13013
  purge_window_sessions: 20
  embargo_sessions: 20
  group_unit: instrument

feature_clusters:
  cluster_compression:
    - volatility_20d
    - volatility_60d
    - range_width_20d
  cluster_position_strength:
    - distance_from_20d_low
    - close_vs_sma20
    - close_position_20d
  cluster_participation:
    - turnover_zscore_20d
    - amount_ratio_5d_20d
    - volume_up_price_not_down_5d
  cluster_drawdown_morphology:
    - max_drawdown_20d
    - ret_20d
    - ret_60d
    - rebound_from_20d_low
  cluster_denominator_controls:
    - board_bucket
    - calendar_year
    - liquidity_bucket
    - volatility_bucket

thresholds:
  binary_calibration_weighted_abs_error: 0.02
  utility_calibration_weighted_abs_error: 0.0025
  min_eval_treated_n: 1
  min_eval_control_n: 1
  broad_baseline_min_control_n: 50
