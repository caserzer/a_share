selected_label:
  label_id: vol20d_kup2p0_kdn1p0_H20
  vol_reference_id: volatility_20d
  horizon_sessions: 20
  k_up: 2.0
  k_dn: 1.0

native_universe:
  liquidity_quantile: 0.05
  continuity_threshold: 0.95
  volatility_floor_quantile: 0.01
  volatility_cap_quantile: 0.99
  liquidity_quantile_candidates: [0.01, 0.02, 0.05, 0.10]
  continuity_threshold_candidates: [0.80, 0.90, 0.95, 1.00]
  volatility_floor_quantile_candidates: [0.01, 0.02, 0.05]
  volatility_cap_quantile_candidates: [0.95, 0.98, 0.99]
  sensitivity_variants:
    - variant_id: base
      liquidity_quantile: 0.05
      continuity_threshold: 0.95
      volatility_floor_quantile: 0.01
      volatility_cap_quantile: 0.99
    - variant_id: loose_liquidity_p02
      liquidity_quantile: 0.02
      continuity_threshold: 0.95
      volatility_floor_quantile: 0.01
      volatility_cap_quantile: 0.99
    - variant_id: strict_liquidity_p10
      liquidity_quantile: 0.10
      continuity_threshold: 0.95
      volatility_floor_quantile: 0.01
      volatility_cap_quantile: 0.99
    - variant_id: strict_continuity_100
      liquidity_quantile: 0.05
      continuity_threshold: 1.00
      volatility_floor_quantile: 0.01
      volatility_cap_quantile: 0.99
    - variant_id: strict_vol_p02_p98
      liquidity_quantile: 0.05
      continuity_threshold: 0.95
      volatility_floor_quantile: 0.02
      volatility_cap_quantile: 0.98

label_cache_mismatch:
  return_abs_tolerance: 0.0000000001

tokens:
  max_token_candidate_n: 120
  quantile_rules:
    - threshold_rule: bottom_10pct
      quantile: 0.10
      comparator: le
      orientation: asc
    - threshold_rule: bottom_20pct
      quantile: 0.20
      comparator: le
      orientation: asc
    - threshold_rule: top_20pct
      quantile: 0.80
      comparator: ge
      orientation: desc
    - threshold_rule: top_10pct
      quantile: 0.90
      comparator: ge
      orientation: desc

thresholds:
  min_train_token_support_n: 500
  min_train_token_positive_n: 50
  min_validation_token_support_n: 200
  min_robustness_token_support_n: 200
  min_validation_auc: 0.55
  min_robustness_auc: 0.55
  min_validation_top_decile_lift: 0.02
  max_fast_fail_uplift: 0.02
  max_lower_first_uplift: 0.01
  min_captured_positive_n: 50
  min_coverage_share: 0.005
  cost_buffer_bps: 100
  morphology_corr_threshold: 0.70
  morphology_auc_margin: 0.02
  fdr_q_value_max: 0.10
  min_deflated_auc_validation: 0.53
  max_retained_row_share_delta: 0.10
  max_winner_base_rate_delta: 0.02
  max_board_mix_abs_delta: 0.08
  max_year_mix_abs_delta: 0.08

bootstrap:
  seed: 1313
  n_resamples: 200
  min_valid_replicates: 100
