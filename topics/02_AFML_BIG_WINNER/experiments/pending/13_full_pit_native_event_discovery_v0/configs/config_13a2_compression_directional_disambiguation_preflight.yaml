  vol_reference_id: volatility_20d
  horizon_sessions: 20
  k_up: 2.0
  k_dn: 1.0

native_universe:
  liquidity_quantile: 0.05
  continuity_threshold: 0.95
  volatility_floor_quantile: 0.01
  volatility_cap_quantile: 0.99
  liquidity_quantile_candidates: [0.01, 0.02, 0.05, 0.10]
  continuity_threshold_candidates: [0.80, 0.90, 0.95, 1.00]
  volatility_floor_quantile_candidates: [0.01, 0.02, 0.05]
  volatility_cap_quantile_candidates: [0.95, 0.98, 0.99]

base_compression:
  selected_token_id: volatility_20d__bottom_20pct
  selected_token_family_id: volatility_range
  selected_primitive_id: volatility_20d
  min_train_n: 5000
  min_validation_n: 1000
  min_robustness_n: 1000

directional_filters:
  max_directional_candidate_n: 240
  quantile_rules:
    - threshold_rule: top_50pct
      quantile: 0.50
    - threshold_rule: top_40pct
      quantile: 0.60
    - threshold_rule: top_30pct
      quantile: 0.70
    - threshold_rule: top_20pct
      quantile: 0.80
  pair_threshold_rules:
    - threshold_rule: top_40pct
      quantile: 0.60
    - threshold_rule: top_30pct
      quantile: 0.70

thresholds:
  min_train_treated_n: 1000
  min_train_positive_n: 100
  min_eval_treated_n: 500
  min_eval_positive_n: 50
  min_train_auc: 0.55
  min_eval_auc: 0.55
  min_top_decile_lift: 0.02
  max_train_lower_first_uplift: 0.02
  max_eval_lower_first_uplift: 0.0
  max_eval_fast_fail_uplift: 0.01
  min_coverage_share_within_native: 0.005
  min_coverage_share_within_base: 0.02
  min_captured_positive_n: 50
  min_captured_positive_share_within_base: 0.05
  morphology_corr_threshold: 0.70
  fdr_q_value_max: 0.10
  min_deflated_auc_validation: 0.55
  max_board_drift_default: 0.15
  max_board_drift_strict: 0.10

bootstrap:
  seed: 13202
  n_resamples: 500
  min_valid_replicates: 250
  ci_low_quantile: 0.05
  unit: instrument_month_block

cost_buffer:
  default_return: 0.01
