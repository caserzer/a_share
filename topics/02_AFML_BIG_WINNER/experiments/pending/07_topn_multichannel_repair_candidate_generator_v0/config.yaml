experiment:
  name: "topn_multichannel_repair_candidate_generator_v0"
  status: "implementation_v0"
  workstream: "Top-N Multichannel Repair Candidate Generator"
  objective: "Build a PIT observable multichannel repair/continuation candidate pool on the frozen 06 Top-N/proxy denominator."
  data_cutoff: "2026-05-31"

paths:
  stock_daily_csv_dir: "data/interim/qlib_csv/day"
  benchmark_daily_csv: "data/processed/index/benchmark_indices_daily.csv"
  topn_executable_universe_csv: "data/processed/universe/pit_topn_400_100_executable_daily.csv"
  topn_membership_universe_csv: "data/processed/universe/pit_topn_400_100_membership_daily.csv"
  upstream_05_run_manifest_json: "experiments/pending/05_pit_topn_400_100_universe_v0/outputs/manifests/run_manifest.json"
  upstream_05_data_source_coverage_audit_csv: "experiments/pending/05_pit_topn_400_100_universe_v0/outputs/publishable/tables/data_source_coverage_audit.csv"
  upstream_06_run_manifest_json: "experiments/pending/06_rerun_02_reverse_lifecycle_on_topn_universe_v0/outputs/manifests/run_manifest.json"
  upstream_06_episode_reference_parquet: "experiments/pending/06_rerun_02_reverse_lifecycle_on_topn_universe_v0/outputs/local_cache/topn_big_winner_episode_reference.parquet"
  upstream_06_denominator_summary_csv: "experiments/pending/06_rerun_02_reverse_lifecycle_on_topn_universe_v0/outputs/publishable/tables/topn_denominator_summary.csv"
  upstream_06_split_denominator_summary_csv: "experiments/pending/06_rerun_02_reverse_lifecycle_on_topn_universe_v0/outputs/publishable/tables/topn_split_denominator_summary.csv"
  upstream_03_report_md: "experiments/pending/03_observable_anchor_event_contract_v0/outputs/publishable/reports/observable_anchor_event_contract_report.md"
  upstream_04_run_manifest_json: "experiments/pending/04_high_recall_repair_event_candidate_generator_v0/outputs/manifests/run_manifest.json"
  upstream_04_event_density_audit_csv: "experiments/pending/04_high_recall_repair_event_candidate_generator_v0/outputs/publishable/tables/event_density_audit.csv"
  upstream_04_report2_md: "experiments/pending/04_high_recall_repair_event_candidate_generator_v0/outputs/publishable/reports/report2.md"

outputs:
  publishable_tables_dir: "experiments/pending/07_topn_multichannel_repair_candidate_generator_v0/outputs/publishable/tables"
  publishable_reports_dir: "experiments/pending/07_topn_multichannel_repair_candidate_generator_v0/outputs/publishable/reports"
  local_cache_dir: "experiments/pending/07_topn_multichannel_repair_candidate_generator_v0/outputs/local_cache"
  large_raw_dir: "experiments/pending/07_topn_multichannel_repair_candidate_generator_v0/outputs/large_raw"
  manifests_dir: "experiments/pending/07_topn_multichannel_repair_candidate_generator_v0/outputs/manifests"

splits:
  train_start: "2017-01-03"
  train_end: "2021-12-31"
  validation_start: "2022-01-01"
  validation_end: "2023-12-31"
  robustness_start: "2024-01-01"

event_generation:
  prior_lookback_sessions: 250
  seed_low_lookback_sessions: 60
  anchor_search_horizon_sessions: 120
  e2_quality_window: 5
  e3_rank_persistence_window: 20
  e3_rank_persistence_floor: 0.0
  e3_rank_persistence_coverage: 0.60
  e6_min_days_after_reclaim: 5
  e6_continuation_window: 20
  e6_stock_vs_market_20d: 0.03
  e6_amount_ratio_20d: 1.20
  e6_close_position_in_range: 0.55
  false_repair_drawdown: -0.10

quality_flags:
  amount_ratio_20d: 1.50
  amount_ratio_60d: 1.20
  close_to_derived_daily_vwap: 0.00
  close_position_in_range: 0.60
  upper_shadow_pct: 0.35

channels:
  recommended:
    - "E1_early_ema60_repair"
    - "E2_money_vwap_repair_confirmation"
    - "E3_rank_persistence"
    - "E6_continuation_discriminator"
  primary_channel_order:
    - "E1_early_ema60_repair"
    - "E2_money_vwap_repair_confirmation"
    - "E3_rank_persistence"
    - "E6_continuation_discriminator"

density:
  seed_density_window: 20
  reclaim_density_window: 20
  recommended_union_same_day_only: true

labels:
  confirm_20:
    horizon_days: 20
    upper_barrier: 0.12
    lower_barrier: -0.08
  failure_10:
    horizon_days: 10
    lower_barrier: -0.10
  continuous_horizons: [10, 20, 30, 60, 120]
  big_winner_mfe_120d: 0.50
  super_winner_mfe_120d: 1.00
  near_winner_mfe_lower: 0.30
  near_winner_mfe_upper: 0.50
  false_repair_drawdown: -0.10

gates:
  min_capture_any_event_before_first_50pct_all: 0.55
  min_capture_any_event_before_first_50pct_validation: 0.45
  min_capture_any_event_before_first_50pct_robustness: 0.45
  min_non_e0_positive_unique_recall_channels: 2
  min_next_open_executable_rate: 0.95
  min_event_precision_label_complete_rate: 0.70
  min_capture_label_complete_rate: 0.90
  max_recommended_union_canonical_events_per_instrument_year_mean: 6.00
  max_recommended_union_canonical_events_per_instrument_year_p95: 12.00
  max_single_channel_density_share: 0.75
  max_density_drag_channel_share: 0.25
  density_drag_incremental_recall_threshold: 0.02
  density_caveat_old_04_multiple: 2.00
  min_clean_baseline_match_coverage_for_precision_claim: 0.70

reporting:
  max_rows_per_table: 16

runtime:
  progress_every_instruments: 100
