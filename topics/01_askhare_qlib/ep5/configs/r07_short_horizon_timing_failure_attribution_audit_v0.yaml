phase: ep5_r07_short_horizon_timing_failure_attribution_audit_v0
plan_id: ep5_e07_short_horizon_timing_failure_attribution_audit_v0
requirement_id: ep5_r07_short_horizon_timing_failure_attribution_audit_v0
requirement_path: ep5/requirement_07_short_horizon_timing_failure_attribution_audit_v0.md
output_root: ep5/outputs/r07_short_horizon_timing_failure_attribution_audit_v0

data_sources:
  r06_output_root: ep5/outputs/r06_gtja191_factor_decay_information_content_audit_v0
  r05_output_root: ep5/outputs/r05_gtja191_train_only_factor_engineering_residual_feasibility_v0
  qlib_provider_uri: data/qlib/cn_data_pit
  pit_universe_path: data/universe/pit_mcap500_mainboard_daily.csv
  pit_qlib_instrument_universe_path: data/universe/pit_qlib_instrument_universe.csv
  pit_industry_path: data/targets/pit_industry_membership.csv
  trading_calendar_path: data/qlib/cn_data_pit/calendars/day.txt
  qlib_instrument_path: data/qlib/cn_data_pit/instruments/pit_mcap500_mainboard.txt
  index_instrument: SH000300
  provider_load_end_date: "2026-04-30"
  local_hedge_data_path: ""

split:
  train_start: "2017-07-04"
  train_end: "2021-12-31"
  validation_start: "2022-01-01"
  validation_end: "2023-12-31"
  robustness_start: "2024-01-01"
  robustness_end: "2025-12-31"

execution:
  signal_date_rule: close_observed_iso_week_last_trading_day
  entry_execution_rule: first_executable_next_open
  natural_exit_rule: open_after_h_trading_days
  horizons: [1, 3, 5, 10]
  buy_cost_bps: 30
  sell_cost_bps: 80
  round_trip_cost_bps: 110
  max_entry_execution_lag_trading_days: 5
  max_exit_execution_lag_trading_days: 5
  mainboard_limit_inference_pct: 0.095

state_axes:
  market_regime:
    definition: CSI300 close-to-close 20-day return observed at signal date
    binning: train_split_tercile
    labels: [market_down, market_flat, market_up]
  stock_short_momentum:
    definition: stock close-to-close 10-day return observed at signal date
    binning: train_split_pooled_tercile
    labels: [stock_down, stock_flat, stock_up]

frozen_formula_constants:
  included_factor_count_expected: 125
  state_axis_count_max: 2
  state_cell_count: 9
  path_horizons: [H1, H3, H5, H10]
  q1_pocket_spread_min: 0.0005
  q1_pocket_rankic_min: 0.0
  q1_pocket_positive_date_share_min: 0.50
  train_information_spread_min: 0.0003
  validation_information_spread_min: 0.0005
  information_rankic_min: 0.0
  positive_spread_date_share_min: 0.50
  monotonicity_min: 0.60
  persistent_top1_max_share: 0.35
  persistent_top5_union_max_share: 0.75
  persistent_new_name_min_share: 0.30
  persistent_rank_turnover_min: 0.35
  style_explained_score_r2_max: 0.35
  style_explained_spread_share_max: 0.50
  neutralized_spread_retention_min: 0.50
  min_style_evaluable_date_count_state: 20
  cost_survival_ratio_min: 0.50
  sample_train_event_count_min: 200
  sample_validation_event_count_min: 80
  sample_robustness_event_count_min: 60
  sample_validation_date_count_min: 20
  sample_robustness_date_count_min: 20
  sample_validation_min_state_date_cross_section_count_min: 30
  sample_robustness_min_state_date_cross_section_count_min: 30
  nondeterioration_validation_spread_tolerance: 0.0010
  nondeterioration_validation_rankic_tolerance: 0.0100
  nondeterioration_validation_monotonicity_tolerance: 0.10
  nondeterioration_validation_top5_tolerance: 0.10
  nondeterioration_robustness_spread_tolerance: 0.0015
  nondeterioration_robustness_rankic_tolerance: 0.0150
  nondeterioration_robustness_monotonicity_tolerance: 0.15
  nondeterioration_robustness_top5_tolerance: 0.15
  q2_validation_information_positive_date_share_min: 0.55
  q2_robustness_spread_floor: -0.0025
  q2_robustness_rankic_floor: -0.0010
  q2_validation_monotonicity_min: 0.60
  q2_robustness_monotonicity_min: 0.45
  q2_cost_robustness_net_return_floor: -0.0025

guardrails:
  allow_new_factors: false
  allow_new_families: false
  allow_extra_horizons: false
  allow_strategy_unit: false
  allow_top_n_or_fraction_selection: false
  allow_online_data: false
  allow_validation_axis_selection: false
  allow_validation_threshold_selection: false
  allow_backtest: false
  allow_big_winner_gate: false
  allow_right_tail_gate: false
  allow_hit_rate_gate: false
